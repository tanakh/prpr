[package]
name = "prpr-codegen"
description = "Code generator of prpr, a Packrat parser generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["peg", "parser", "packrat", "parser-generator", "codegen"]
categories = ["parsing", "development-tools::build-utils"]

[features]
# Modules generated from grammar files, as text: `file` for tools, and `build` for build scripts.
build = ["dep:prettyplease", "dep:syn"]

[dependencies]
prpr-runtime = { workspace = true, features = ["proc-macro2"] }
proc-macro2.workspace = true
quote.workspace = true
prettyplease = { version = "0.3.0", optional = true }
syn = { version = "3.0.9", optional = true, default-features = false, features = ["full", "parsing"] }

[[test]]
name = "build"
required-features = ["build"]
