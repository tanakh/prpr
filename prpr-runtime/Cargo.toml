[package]
name = "prpr-runtime"
description = "Runtime support for parsers generated by prpr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["peg", "parser", "packrat", "runtime"]
categories = ["parsing", "no-std", "development-tools::procedural-macro-helpers"]

# Document everything on docs.rs, including SourceText (proc-macro2).
[package.metadata.docs.rs]
all-features = true

[features]
# `SourceText`: parsing the input of a proc-macro as text, and mapping positions back to spans.
proc-macro2 = ["dep:proc-macro2"]

[dependencies]
proc-macro2 = { workspace = true, optional = true }
