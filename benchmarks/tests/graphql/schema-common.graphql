# Every kind of type system definition that all the parsers support.
schema @onSchema {
  query: QueryType
  mutation: MutationType
}

"A scalar"
scalar CustomScalar @onScalar

"""
  An object type,
    with a description over several lines.
"""
type Foo implements Bar & Baz & Two @onObject {
  "A field"
  one: Type
  """
  A field with an argument
  """
  two(
    "An argument"
    argument: InputType!
  ): Type
  three(argument: InputType, other: String): Int
  four(argument: String = "string"): String
  five(argument: [String] = ["string", "string"]): String
  six(argument: InputType = {key: "value"}): Type
  seven(argument: Int = null): Type
  deprecated: String @deprecated(reason: "no longer used")
}

type AnnotatedObject @onObject(arg: "value") {
  annotatedField(arg: Type = "default" @onArgumentDefinition): Type @onField
}

type UndefinedType

extend type Foo {
  seven(argument: [String]): Type
}

extend type Foo @onType

interface Bar implements Two {
  one: Type
  four(argument: String = "string"): String
}

interface UndefinedInterface

extend interface Bar implements Two {
  two(argument: InputType!): Type
}

union Feed = | Story | Article | Advert

union UndefinedUnion

extend union Feed = Photo | Video

enum Site {
  "A value"
  DESKTOP
  MOBILE @onEnumValue
  WEB
}

extend enum Site {
  VR
}

input InputType {
  key: String!
  answer: Int = 42
}

extend input InputType {
  other: Float = 1.23e4 @onInputFieldDefinition
}

"""
A directive.
"""
directive @skip(if: Boolean!, unless: Boolean) repeatable on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

directive @include2(if: Boolean!) on
  | FIELD
  | FRAGMENT_SPREAD

extend scalar CustomScalar @onScalar
