[package]
name = "prpr-cli"
description = "Command line interface of prpr, a Packrat parser generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["peg", "parser", "packrat", "parser-generator", "cli"]
categories = ["parsing", "command-line-utilities"]

[[bin]]
name = "prpr"
path = "src/main.rs"

[dependencies]
prpr-codegen = { workspace = true, features = ["build"] }
clap = { version = "4.6.7", features = ["derive"] }
