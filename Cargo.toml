[workspace]
members = ["prpr-runtime", "prpr-codegen", "prpr-macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Hideyuki Tanaka <tanaka.hideyuki@gmail.com>"]
license = "MIT"
repository = "https://github.com/tanakh/prpr"

[workspace.dependencies]
prpr-runtime = { path = "prpr-runtime", version = "=0.1.0" }
prpr-codegen = { path = "prpr-codegen", version = "=0.1.0" }
prpr-macros = { path = "prpr-macros", version = "=0.1.0" }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"

[package]
name = "prpr"
description = "A Packrat parser generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prpr-runtime.workspace = true
prpr-macros.workspace = true

[dev-dependencies]
ui_test = "0.30.7"

[[test]]
name = "ui"
harness = false
