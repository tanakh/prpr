[workspace]
members = ["prpr-runtime", "prpr-codegen", "prpr-macros", "prpr-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Hideyuki Tanaka <tanaka.hideyuki@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tanakh/prpr"
homepage = "https://tanakh.github.io/prpr/"

[workspace.dependencies]
prpr-runtime = { path = "prpr-runtime", version = "=0.1.0" }
prpr-codegen = { path = "prpr-codegen", version = "=0.1.0" }
prpr-macros = { path = "prpr-macros", version = "=0.1.0" }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"

[package]
name = "prpr"
description = "A Packrat parser generator for Parsing Expression Grammars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["peg", "parser", "packrat", "parser-generator", "grammar"]
categories = ["parsing", "development-tools::procedural-macro-helpers"]
# The book stays in the package for its doctests. The UI tests need tests/ui-deps, a package of
# its own, which is not part of this one.
exclude = [".github", "docs", "tests/ui", "tests/ui.rs"]

[features]
# `runtime::SourceText`, for parsing the input of proc-macros.
proc-macro2 = ["prpr-runtime/proc-macro2"]

[dependencies]
prpr-runtime.workspace = true
prpr-macros.workspace = true

[dev-dependencies]
ui_test = "0.30.7"

[[test]]
name = "ui"
harness = false
